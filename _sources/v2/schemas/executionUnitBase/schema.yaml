# NOTE: the upstream draft's "docker"/"oci" branch below points its `value` property at a full
# executionUnitContainer.yaml schema (container image ref, deployment info, hardware config,
# input/output CLI bindings). That schema belongs to the (not yet adopted, not yet built in this
# register) "Docker" conformance class, so this branch is simplified to a generic object here.
# The "cwl" and "other/custom" branches are reproduced faithfully from the draft.
oneOf:
  - $ref: bblocks://ogc.api.processes.v1.schemas.link
  - allOf:
      - $ref: bblocks://ogc.api.processes.v1.schemas.qualifiedValue
      - anyOf:
          - description: |-
              The execution unit is a container image. The full schema for this branch's
              `value` property (executionUnitContainer.yaml in the upstream draft) is out of
              scope until the "Docker" conformance class is built in this register.
            type: object
            required:
              - type
            properties:
              type:
                type: string
                enum:
                  - docker
                  - oci
              value:
                type: object
                additionalProperties: true
          - description: |-
              The execution unit is CWL script.
            type: object
            required:
              - mediaType
            properties:
              mediaType:
                type: string
                enum:
                  - application/cwl
              value:
                $ref: https://raw.githubusercontent.com/common-workflow-language/cwl-v1.2/main/json-schema/cwl.yaml
          - description: |-
              The execution unit is not Docker/OCI or CWL and cannot be properly described via
              the "mediaType" property of a qualified value using an RFC 2046 media type (e.g.
              an "R" or "Python" script). In this case a community-defined or custom token may
              be used with the "type" property.
            type: object
            required:
              - type
            properties:
              type:
                type: string
